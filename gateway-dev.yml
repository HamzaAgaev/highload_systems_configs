server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      default-filters:
        - name: Retry
          args:
            retries: 2
            methods: GET
            series: SERVER_ERROR
            exceptions:
              - java.io.IOException
              - java.util.concurrent.TimeoutException
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
              factor: 2
              basedOnPreviousValue: false
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user-service/**
          filters:
            - StripPrefix=3
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/v1/project-service/**
          filters:
            - StripPrefix=3
            - name: CircuitBreaker
              args:
                name: projectServiceCircuitBreaker
                fallbackUri: forward:/fallback/project-service
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat-service/**
          filters:
            - StripPrefix=3
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat-service

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs-springdoc
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Unified API
        url: /v3/api-docs
    urls-primary-name: Unified API
    disable-swagger-default-url: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
    registry-fetch-interval-seconds: 5
    instance-info-replication-interval-seconds: 5
  instance:
    hostname: gateway
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

spring.cloud.loadbalancer:
  cache:
    ttl: 5s
    capacity: 256
  health-check:
    initial-delay: 0s
    interval: 5s

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 8s
        recordExceptions:
          - org.springframework.web.server.ResponseStatusException
          - java.util.concurrent.TimeoutException
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
        ignoreExceptions:
          - java.io.IOException
          - org.springframework.cloud.gateway.support.NotFoundException
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
        slowCallDurationThreshold: 15s
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      projectServiceCircuitBreaker:
        baseConfig: default
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      chatServiceCircuitBreaker:
        baseConfig: default
        slowCallDurationThreshold: 10s
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

