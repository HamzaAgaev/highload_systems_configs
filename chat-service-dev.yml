spring:
  application:
    name: chat-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres-chat:5432/chat_service_db
    username: chat_service
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
  instance:
    hostname: chat-service

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    use-root-path: false
    path: /swagger-ui.html
