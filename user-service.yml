spring:
  application:
    name: user-service
  r2dbc:
    url: r2dbc:postgresql://postgres-user:5432/user_service_db
    username: user_service
    password: password
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yml

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
  instance:
    hostname: user-service
