server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user-service/**
          filters:
            - StripPrefix=3
            - name: CircuitBreaker
              args:
                name: userServiceCircuitBreaker
                fallbackUri: forward:/fallback/user-service
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/v1/project-service/**
          filters:
            - StripPrefix=3
            - name: CircuitBreaker
              args:
                name: projectServiceCircuitBreaker
                fallbackUri: forward:/fallback/project-service
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/v1/chat-service/**
          filters:
            - StripPrefix=3
            - name: CircuitBreaker
              args:
                name: chatServiceCircuitBreaker
                fallbackUri: forward:/fallback/chat-service

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs-springdoc
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Unified API
        url: /v3/api-docs
    urls-primary-name: Unified API
    disable-swagger-default-url: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka:8761/eureka/
  instance:
    hostname: gateway

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
        recordExceptions:
          - org.springframework.web.server.ResponseStatusException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
          - org.springframework.cloud.gateway.support.NotFoundException
    instances:
      userServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      projectServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
      chatServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 50

